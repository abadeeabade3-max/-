<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Glowing background effect -->
  <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.15" filter="url(#glow)"/>

  <!-- Stylized Dumbbell / Hexagon Elements -->
  <g transform="translate(256, 256)">
    <!-- Central Barbell Axis -->
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#525252"/>
    
    <!-- Weight plates left -->
    <rect x="-180" y="-80" width="26" height="160" rx="12" fill="#262626" stroke="#404040" stroke-width="4"/>
    <rect x="-150" y="-60" width="20" height="120" rx="10" fill="#10b981"/>

    <!-- Weight plates right -->
    <rect x="154" y="-80" width="26" height="160" rx="12" fill="#262626" stroke="#404040" stroke-width="4"/>
    <rect x="130" y="-60" width="20" height="120" rx="10" fill="#10b981"/>

    <!-- Dynamic Lightning Bolt Symbol in center -->
    <polygon points="18,-110 -60,20 -2,20 -22,110 64,-20 8,-20" fill="url(#accentGrad)" filter="url(#glow)"/>
  </g>

  <!-- Text Badge -->
  <text x="256" y="440" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-weight="900" font-size="38" fill="#ffffff" letter-spacing="2">POWER GYM</text>
  <text x="256" y="475" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-weight="700" font-size="22" fill="#10b981">باور جيم</text>
</svg>
